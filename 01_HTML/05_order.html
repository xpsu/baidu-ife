<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" type="text/css" href="style.css">
  <link href="https://fonts.googleapis.com/css?family=Rubik" rel="stylesheet">
  <title>Forms Review</title>
</head>
<body>
<section id="overlay">

  <p id="logo">Order your milktea!</p>
  <hr>
  <form action="./submission.html" method="get">
    <label>
      你想要什么口味的奶茶？
      <input type="text" placeholder="茉莉奶绿" required="required" min="2" max="10">
    </label>
    <hr>
    <label>
      你想要几杯？
      <input type="number" placeholder="" required="required" min="1" max="4">
    </label>
    <hr>
    <label>
      你需要的糖分量 <br>
      无糖<input type="range" name="sugar" id="sugar" min="1" max="5">全糖
    </label>
    <hr>
    <label>
      你想要什么预料？ <br>
      <input type="checkbox" name="" id="">冰淇淋
      <input type="checkbox" name="" id="">奶盖
      <input type="checkbox" name="" id="">可可粉
    </label>
    <hr>
    <label>
      你需要加冰吗？<br>
      <input type="radio" name="ice" id="">加冰
      <input type="radio" name="ice" id="">不加冰
    </label>
    <hr>
    <label>
      你需要加什么料？ <br>
      <select name="" id="">
        <option>珍珠</option>
        <option>波霸</option>
        <option>布丁</option>
      </select>
    </label>
    <hr>
    <label>
      你要什么规格：
      <select>
        <option>大杯</option>
        <option>中杯</option>
        <option>小杯</option>
      </select>
    </label>
    <hr>
    <label>
      您还有别的什么要求吗？<br>
      <textarea>

    </textarea>
    </label>
    <hr>
    <label>
      您的联系方式：<input type="number" name="" id="phone" pattern="/^1[3-9]\d{9}$/" oninvalid="setCustomValidity('请输入11位数字')">
    </label>
    <hr>
    <input type="submit" value="提交">
  </form>
</section>

</body>
</html>
